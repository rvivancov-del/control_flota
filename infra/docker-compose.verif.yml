# Pila de verificación aislada: el mismo código y las mismas imágenes que la pila de trabajo,
# pero con base de datos propia (volumen propio) y otros puertos. Sirve para correr las pruebas de
# integración, que escriben datos, sin tocar la base de trabajo. Ver scripts/README.md.
#
#   docker compose build                                   # las imágenes se reutilizan por nombre
#   docker compose -p flota_verif -f docker-compose.yml -f infra/docker-compose.verif.yml up -d
#   docker compose -p flota_verif exec -T postgres psql -U flota -d flota_db -v ON_ERROR_STOP=1 -q < scripts/seed/pilot_dataset.sql
#   FLOTA_BASE_URL=http://host.docker.internal:18080/api ...pytest...   # gateway de verificación: :18080
#   docker compose -p flota_verif down -v                  # elimina la pila y su volumen
#
# Los nombres de imagen suponen que la carpeta del repositorio se llama "sistema-control-flota".
services:
  postgres:
    ports: !override []
  auth-service:
    image: sistema-control-flota-auth-service
    environment:
      CORS_ORIGINS: http://localhost:15173
  fleet-core-service:
    image: sistema-control-flota-fleet-core-service
    environment:
      CORS_ORIGINS: http://localhost:15173
  reporting-service:
    image: sistema-control-flota-reporting-service
    environment:
      CORS_ORIGINS: http://localhost:15173
  gateway:
    ports: !override ["18080:80"]
  frontend:
    image: sistema-control-flota-frontend
    ports: !override ["15173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:18080/api
