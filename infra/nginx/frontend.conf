# Sirve la SPA compilada (frontend/Dockerfile.prod) en modo producción. No hace proxy a la API: eso
# lo hace el gateway (infra/nginx/nginx.prod.conf), que es lo único expuesto al exterior.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # RF-14/RF-17 y el resto de rutas del cliente (React Router): sin este try_files, recargar
    # cualquier ruta que no sea "/" (p. ej. /vehiculos) da 404, porque ese archivo no existe en disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets que Vite compila llevan un hash en el nombre (p. ej. index-a1b2c3d4.js): cambian de
    # nombre cuando cambia el contenido, así que se pueden cachear de forma agresiva sin arriesgar
    # servir una versión vieja. index.html, en cambio, nunca se cachea: es el punto de entrada que
    # referencia esos assets, y debe verse siempre la versión actual.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }
}
