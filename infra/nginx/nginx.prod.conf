# Gateway de producción: mismos proxys y límites de tasa que infra/nginx/nginx.conf, más TLS y
# cabeceras de seguridad, y sirve el frontend a través del mismo origen que la API (sin CORS).
# Termina TLS en el puerto 8443 (no root: ver frontend/Dockerfile.prod para la razón del puerto);
# docker-compose.prod.yml lo publica como 443. El puerto 8080 solo redirige a HTTPS.
#
# pid en /tmp: el maestro de nginx-unprivileged corre como un usuario sin privilegios (no root, a
# diferencia del nginx:alpine de infra/nginx/nginx.conf), que no puede escribir en /run; al
# reemplazar aquí TODO nginx.conf (no solo un server block) se pierde el "pid /tmp/nginx.pid;" que
# trae por defecto la imagen base, así que hay que repetirlo.
pid /tmp/nginx.pid;
events {}

http {
  log_format flota '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout flota;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=despacho:10m rate=30r/m;
  limit_req_status 429;

  server {
    listen 8080;
    server_name _;
    # El único tráfico legítimo por HTTP es el redirect a HTTPS; nada se sirve en claro (RNF-02).
    return 301 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeceras de seguridad estándar. CSP se queda deliberadamente permisiva con 'unsafe-inline' en
    # estilos (Vite y algunas librerías de gráficos los inyectan en línea); ajustarla exige un
    # inventario de qué necesita cada una antes de endurecerla más.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://auth-service:8000/login;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/ {
      proxy_pass http://auth-service:8000/;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/fleet/despacho/ {
      limit_req zone=despacho burst=20 nodelay;
      proxy_pass http://fleet-core-service:8000/despacho/;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/fleet/ {
      proxy_pass http://fleet-core-service:8000/;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /api/reports/ {
      proxy_pass http://reporting-service:8000/;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Todo lo que no es /api/* es la SPA: el gateway proxya al contenedor del frontend, que ya
    # resuelve el "try_files ... /index.html" de las rutas del cliente (infra/nginx/frontend.conf).
    location / {
      proxy_pass http://frontend:8080;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
