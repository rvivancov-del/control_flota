events {}

http {
  # Registro de acceso SIN la cadena de consulta (RNF-11, LOPDP): un cliente que ponga un dato
  # personal o una credencial en la URL (p. ej. ?token=) no lo deja escrito en los registros.
  log_format flota '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout flota;

  # Límite de tasa por IP de origen. Detrás de un balanceador o de Cloud Run
  # hay que restaurar la IP real del cliente (real_ip_header); en local todas
  # las peticiones llegan con la IP del puente de Docker y comparten el cupo.
  #  - login: frena la adivinación de contraseñas (RNF-03), además del bloqueo
  #    por intentos fallidos de auth-service.
  #  - despacho: frena la adivinación de la credencial del QR (RF-18); un
  #    despacho legítimo son 2 peticiones.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=despacho:10m rate=30r/m;
  limit_req_status 429;

  server {
    listen 80;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://auth-service:8000/login;
    }

    location /api/auth/ {
      proxy_pass http://auth-service:8000/;
    }

    location /api/fleet/despacho/ {
      limit_req zone=despacho burst=20 nodelay;
      proxy_pass http://fleet-core-service:8000/despacho/;
    }

    location /api/fleet/ {
      proxy_pass http://fleet-core-service:8000/;
    }

    location /api/reports/ {
      proxy_pass http://reporting-service:8000/;
    }
  }
}
