<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="FlotaControl — Cada kilómetro, bajo control">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A5C"/>
      <stop offset="1" stop-color="#0F2236"/>
    </linearGradient>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#fondo)"/>
  <rect width="1280" height="320" rx="18" fill="url(#puntos)"/>
  <!-- hexágono con camión -->
  <g transform="translate(110 160)">
    <polygon points="0,-74 64,-37 64,37 0,74 -64,37 -64,-37" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-30" y="-20" width="34" height="30" rx="3"/>
      <path d="M4 -10 H20 L30 2 V10 H4 Z"/>
      <circle cx="-16" cy="17" r="7" fill="#1B3A5C"/>
      <circle cx="18" cy="17" r="7" fill="#1B3A5C"/>
    </g>
    <g stroke="#E87D1E" stroke-width="4" stroke-linecap="round">
      <line x1="-50" y1="-12" x2="-38" y2="-12"/><line x1="-54" y1="-2" x2="-38" y2="-2"/><line x1="-50" y1="8" x2="-38" y2="8"/>
    </g>
  </g>
  <text x="215" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">FlotaControl</text>
  <text x="219" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#C9D6E3">Cada kilómetro, bajo control.</text>
  <text x="219" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#9FB3C8">Costos operativos · Mantenimiento con AHP · Despacho por código QR · Microservicios</text>
  <!-- ruta -->
  <line x1="880" y1="236" x2="1220" y2="236" stroke="#E87D1E" stroke-width="5" stroke-dasharray="22 16" stroke-linecap="round"/>
  <g transform="translate(1010 200)" fill="none" stroke="#E87D1E" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="0" width="58" height="34" rx="4" fill="#0F2236"/>
    <path d="M58 10 H78 L92 24 V34 H58 Z" fill="#0F2236"/>
    <circle cx="16" cy="40" r="8" fill="#0F2236"/>
    <circle cx="76" cy="40" r="8" fill="#0F2236"/>
  </g>
</svg>
