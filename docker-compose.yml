services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-flota_db}
      # Contraseñas de los roles de cada servicio (ver infra/postgres/roles.sql). Deben coincidir con
      # POSTGRES_PASSWORD del .env de cada servicio; fuera de desarrollo, defínalas con valores reales.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-changeme_local_only}
      FLEET_DB_PASSWORD: ${FLEET_DB_PASSWORD:-changeme_local_only}
    # Memoria compartida para operaciones con varios procesos paralelos (VACUUM/CREATE INDEX con la
    # flota crecida, benchmark a 10^6 filas): el valor por defecto de Docker (64 MB) se queda corto y
    # esas operaciones fallan con "could not resize shared memory segment".
    shm_size: "256mb"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # roles.sql va fuera de docker-entrypoint-initdb.d a propósito: allí se ejecutaría solo, sin las contraseñas.
      - ./infra/postgres/roles.sql:/opt/flota/roles.sql:ro
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    # Sin "ports": la base de datos no se publica en el equipo anfitrión; solo la ven los servicios de la red de
    # Docker. Para una consola: docker compose exec postgres psql -U flota -d flota_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flota}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    env_file: ./services/auth-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  fleet-core-service:
    build: ./services/fleet-core-service
    restart: unless-stopped
    env_file: ./services/fleet-core-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  reporting-service:
    build: ./services/reporting-service
    restart: unless-stopped
    env_file: ./services/reporting-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - fleet-core-service
      - reporting-service

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  postgres_data:
