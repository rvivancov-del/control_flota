services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-flota_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flota}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    env_file: ./services/auth-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  fleet-core-service:
    build: ./services/fleet-core-service
    restart: unless-stopped
    env_file: ./services/fleet-core-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  reporting-service:
    build: ./services/reporting-service
    restart: unless-stopped
    env_file: ./services/reporting-service/.env.example
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - fleet-core-service
      - reporting-service

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  postgres_data:
